configuration:
  public_url:
    name: Public URL
    description: HTTPS origin your reverse proxy serves this add-on at, such as https://anki.example.com.
  password:
    name: Password
    description: The password clients sign in with, at least 12 characters. Restart the add-on right after saving. On start it stores the password as a hash and clears this field. Enter a new one to change it.
  password_hash:
    name: Password hash
    description: Filled in by the add-on from Password. Leave it alone.
  scopes:
    name: Scopes
    description: Comma-separated tool groups to expose (read, write, admin, destructive).
  allow_schema_changes:
    name: Allow note type changes
    description: Lets clients create note types and change their CSS, template text and names. Needs admin in Scopes.
  allow_full_sync:
    name: Allow full syncs
    description: Also lets clients add, remove or reorder note type fields and templates, which forces a full sync with AnkiWeb. Needs Allow note type changes.
  sync_username:
    name: AnkiWeb username
    description: Used to log in and download your collection when the add-on has none yet.
  sync_password:
    name: AnkiWeb password
    description: Only needed until the first successful start; the sync key is kept afterwards. Clear it then.
  log_level:
    name: Log level
    description: Use debug to see diagnostics such as refused OAuth redirect URIs.
