name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anki_mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: frenck/action-addon-linter@v2.21.2
        with:
          path: ./anki_mcp
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Add-on version goes up when the add-on changes
        if: github.event_name == 'pull_request'
        run: .github/scripts/version-check.sh
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: anki_mcp
          load: true
          tags: anki-mcp-addon:ci
      - name: Smoke test
        run: .github/scripts/smoke-test.sh
